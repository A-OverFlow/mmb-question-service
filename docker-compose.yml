# 개발 서버 배포 설정
services:
  app:
    image: mumulbo/question-service:dev
    env_file:
      - .env
    ports:
      - "${SERVICE_PORT}:8080"
    networks:
      - external-net
    depends_on:
      - db
    restart: always
  # db 컨테이너만 실행 : docker compose up -d db
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${HOST_DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - external-net

volumes:
  mysql_data:

networks:
  external-net:
    external: true
    name: sample-network
